[workspace]
resolver = "2"
members = ["crates/service", "crates/lookstow"]

# The version follows package.json: one number for the app and its launcher.
[workspace.package]
version = "0.11.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.89"

[workspace.dependencies]
lookstow-service = { path = "crates/service" }
anyhow = "=1.0.104"
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
ed25519-dalek = "=2.2.0"
getrandom = { version = "=0.2.17", features = ["std"] }
hex = "=0.4.3"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
windows-service = "=0.8.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# A function that can fail on one platform only (a Windows known folder) keeps one
# signature on every platform; this lint would make each platform's callers differ.
unnecessary_wraps = "allow"
